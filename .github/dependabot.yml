version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-patch-and-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /apps/engine
    schedule:
      interval: weekly
