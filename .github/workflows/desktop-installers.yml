name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      media_tag:
        description: Release tag containing the approved FFmpeg archives
        type: string
        required: true
      signed:
        description: Require Windows and macOS signing and macOS notarization
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installers:
    if: ${{ !inputs.signed || github.ref == 'refs/heads/master' }}
    environment: ${{ inputs.signed && 'desktop-signing' || 'desktop-preview' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2025
            target: win-x64
          - runner: macos-15
            target: mac-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@12.15.0
      - run: python -m pip install uv==0.13.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: uv audit --locked --no-dev --python-version 3.12
        working-directory: apps/engine
      - run: pnpm --filter phonivra build
      - name: Download the approved media archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_TAG: ${{ inputs.media_tag }}
          MEDIA_FILE: ffmpeg-${{ matrix.target }}.zip
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern "$MEDIA_FILE" --output "$MEDIA_FILE" -- "$MEDIA_TAG"
      - name: Stage and verify the bundled runtime
        shell: bash
        env:
          MEDIA_FILE: ffmpeg-${{ matrix.target }}.zip
          MEDIA_SHA256: ${{ fromJSON(vars.PHONIVRA_MEDIA_SHA256 || '{}')[matrix.target] }}
        run: python apps/desktop/scripts/stage_release.py --media "$MEDIA_FILE" --sha256 "$MEDIA_SHA256"
      - name: Build preview installer
        if: ${{ !inputs.signed || runner.os == 'Linux' }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter phonivra package
      - name: Build and verify signed Windows installer
        if: ${{ inputs.signed && runner.os == 'Windows' }}
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          pnpm --filter phonivra package --config.forceCodeSigning=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem apps/desktop/.release/installers -File -Filter '*.exe')
          if ($installers.Count -ne 1 -or (Get-AuthenticodeSignature $installers[0].FullName).Status -ne 'Valid') {
            throw 'Expected one valid Authenticode installer signature.'
          }
      - name: Build and verify signed and notarized macOS app
        if: ${{ inputs.signed && runner.os == 'macOS' }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Set APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Set APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID}"
          pnpm --filter phonivra package --config.forceCodeSigning=true
          shopt -s nullglob
          apps=(apps/desktop/.release/installers/*/Phonivra.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phonivra-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/.release/installers/*.deb
            apps/desktop/.release/installers/*.exe
            apps/desktop/.release/installers/*.dmg
