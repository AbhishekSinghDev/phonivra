name: Desktop installers

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-*.yml'
      - 'apps/desktop/electron-builder.cjs'
      - 'apps/desktop/scripts/**'
      - 'apps/engine/pyproject.toml'
      - 'apps/engine/uv.lock'
  workflow_dispatch:
    inputs:
      media_tag:
        description: Approved FFmpeg release tag. Leave blank to build media for an unsigned preview.
        type: string
        default: ''
      signed:
        description: Require Windows and macOS signing and macOS notarization
        type: boolean
        default: false
      prepare_draft:
        description: After review, attach the installers to a draft GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/checks.yml

  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      media_checksums: ${{ steps.inputs.outputs.media_checksums }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source, version, and media inputs
        id: inputs
        env:
          MEDIA_TAG: ${{ inputs.media_tag }}
          MEDIA_RELEASES: ${{ vars.PHONIVRA_MEDIA_SHA256 }}
          SIGNED: ${{ inputs.signed }}
          PREPARE_DRAFT: ${{ inputs.prepare_draft }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$SIGNED" == true ]]; then
            test "$REF_PROTECTED" = true || { echo "Signed builds require a protected ref."; exit 1; }
            test -n "$MEDIA_TAG" || { echo "Signed builds require an approved media tag."; exit 1; }
            git merge-base --is-ancestor HEAD origin/master
            [[ "$GITHUB_REF" == refs/heads/master || "$GITHUB_REF" == refs/tags/v* ]] || exit 1
          fi
          if [[ "$PREPARE_DRAFT" == true && ( "$SIGNED" != true || "$GITHUB_REF" != refs/tags/v* ) ]]; then
            echo "A release draft requires a signed build from a desktop version tag."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "apps/desktop/scripts")
          from release_assets import TARGETS, validate_version

          version = validate_version(json.loads(Path("apps/desktop/package.json").read_text())["version"])
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              sys.exit(f"Desktop version {version} requires the tag v{version}.")
          media_tag = os.environ["MEDIA_TAG"]
          checksums = {}
          if media_tag:
              checksums = json.loads(os.environ["MEDIA_RELEASES"] or "{}").get(media_tag, {})
              if not re.fullmatch(r"media-[A-Za-z0-9._-]+", media_tag) or set(checksums) != set(TARGETS):
                  sys.exit("Enter a media-* tag with a checksum for each target in PHONIVRA_MEDIA_SHA256.")
              if any(not re.fullmatch(r"[a-f0-9]{64}", digest) for digest in checksums.values()):
                  sys.exit("Each media checksum must be a lowercase SHA-256 digest.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"media_checksums={json.dumps(checksums)}", file=output)
          PY

  preview-media:
    if: ${{ inputs.media_tag == '' }}
    needs: preflight
    uses: ./.github/workflows/desktop-media.yml

  installers:
    needs: [checks, preflight, preview-media]
    # Let healthy targets finish even when another preview media build fails.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.preflight.result == 'success' && (needs.preview-media.result == 'success' || needs.preview-media.result == 'failure' || (inputs.media_tag != '' && needs.preview-media.result == 'skipped')) }}
    environment: ${{ inputs.signed && matrix.target != 'linux-x64' && 'desktop-signing' || 'desktop-preview' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            arch: x64
          - runner: windows-2025
            target: win-x64
            arch: x64
          - runner: macos-15
            target: mac-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      TARGET_ARCH: ${{ matrix.arch }}
      MEDIA_TAG: ${{ inputs.media_tag }}
      MEDIA_FILE: ffmpeg-${{ matrix.target }}.zip
      APPROVED_MEDIA_SHA256: ${{ fromJSON(needs.preflight.outputs.media_checksums)[matrix.target] }}
      DESKTOP_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SIGNING: ${{ inputs.signed && 'signed' || 'preview' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@12.15.0
      - run: python -m pip install uv==0.13.5
      - run: pnpm install --frozen-lockfile
      - run: bash .github/scripts/audit-js.sh
      - run: uv audit --locked --no-dev --python-version 3.12
        working-directory: apps/engine
      - run: pnpm --filter phonivra build
      - name: Download the approved media archive
        if: ${{ inputs.media_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern "$MEDIA_FILE" --output "$MEDIA_FILE" -- "$MEDIA_TAG"
      - name: Download media from this preview run
        if: ${{ inputs.media_tag == '' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ffmpeg-${{ matrix.target }}
      - name: Stage and verify the bundled runtime
        shell: bash
        run: |
          digest="$APPROVED_MEDIA_SHA256"
          if [[ -z "$MEDIA_TAG" ]]; then
            read -r digest _ < "${MEDIA_FILE%.zip}.sha256"
          fi
          python apps/desktop/scripts/stage_release.py --media "$MEDIA_FILE" --sha256 "$digest"
          printf 'MEDIA_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
      - name: Build without OS signing
        if: ${{ !inputs.signed || runner.os == 'Linux' }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          XZ_OPT: '-T2'
        run: pnpm --filter phonivra package "--$TARGET_ARCH"
      - name: Build signed Windows installer
        if: ${{ inputs.signed && runner.os == 'Windows' }}
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          pnpm --filter phonivra package "--$env:TARGET_ARCH" --config.forceCodeSigning=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build signed and notarized macOS app
        if: ${{ inputs.signed && runner.os == 'macOS' }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Set APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Set APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID}"
          pnpm --filter phonivra package "--$TARGET_ARCH" --config.forceCodeSigning=true
      - name: Check the Windows installer and packaged runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem apps/desktop/.release/installers -File -Filter '*.exe')
          if ($packages.Count -ne 1) { throw 'Expected one Windows installer.' }
          if ($env:RELEASE_SIGNING -eq 'signed') {
            $signature = Get-AuthenticodeSignature $packages[0].FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw 'The Windows installer must have a valid timestamped signature.'
            }
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'Phonivra installation'
          # NSIS requires /D last and unquoted, including when its path contains spaces.
          $process = Start-Process $packages[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS exited with code $($process.ExitCode)." }
          if ($env:RELEASE_SIGNING -eq 'signed') {
            $app = Get-AuthenticodeSignature (Join-Path $installDir 'Phonivra.exe')
            if ($app.Status -ne 'Valid' -or $app.SignerCertificate.Subject -ne $signature.SignerCertificate.Subject) {
              throw 'The installed Windows app must have a valid signature from the installer publisher.'
            }
          }
          python apps/desktop/scripts/smoke_runtime.py (Join-Path $installDir 'resources/engine')
      - name: Mount and check the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=(apps/desktop/.release/installers/*.dmg)
          test "${#images[@]}" -eq 1
          mount=$(mktemp -d)
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rmdir "$mount"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}"
          app="$mount/Phonivra.app"
          if [[ "$RELEASE_SIGNING" == signed ]]; then
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
          fi
          python apps/desktop/scripts/smoke_runtime.py "$app/Contents/Resources/engine"
      - name: Install and smoke-test the package on clean Ubuntu and Debian images
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          packages=(apps/desktop/.release/installers/*.deb)
          test "${#packages[@]}" -eq 1
          bash apps/desktop/scripts/smoke_deb.sh "${packages[0]}" ubuntu:22.04
          bash apps/desktop/scripts/smoke_deb.sh "${packages[0]}" ubuntu:24.04
          bash apps/desktop/scripts/smoke_deb.sh "${packages[0]}" debian:12-slim
      - name: Record the installer checksum and build inputs
        shell: bash
        run: python apps/desktop/scripts/release_assets.py apps/desktop/.release/installers apps/desktop/.release/assets "$DESKTOP_VERSION" --target "$TARGET"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phonivra-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: apps/desktop/.release/assets/*

  draft:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.prepare_draft && needs.preflight.result == 'success' && needs.installers.result == 'success' }}
    needs: [preflight, installers]
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ needs.preflight.outputs.version }}
      MEDIA_TAG: ${{ inputs.media_tag }}
      MEDIA_CHECKSUMS: ${{ needs.preflight.outputs.media_checksums }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: phonivra-*
          path: release-artifacts
      - name: Verify the complete signed asset set
        run: python3 apps/desktop/scripts/release_assets.py release-artifacts release-assets "$DESKTOP_VERSION"
      - name: Create the GitHub Release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$DESKTOP_VERSION"
          test "$GITHUB_REF" = "refs/tags/$tag"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          flags=()
          if [[ "$DESKTOP_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" release-assets/* --verify-tag --draft --generate-notes "${flags[@]}"
