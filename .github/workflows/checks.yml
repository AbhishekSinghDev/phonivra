name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@12.15.0
      - run: python -m pip install uv==0.13.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: uvx --from ruff==0.17.4 ruff check apps/desktop/scripts

  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@12.15.0
      - run: python -m pip install uv==0.13.5
      - run: pnpm audit --audit-level high
      - name: Audit Python on all release platforms
        if: ${{ !cancelled() }}
        working-directory: apps/engine
        run: |
          status=0
          for platform in linux windows macos; do
            uv audit --locked --no-dev --python-version 3.12 --python-platform "$platform" || status=1
          done
          exit "$status"
