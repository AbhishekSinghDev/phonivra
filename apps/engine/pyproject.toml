[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phonivra-engine"
version = "0.1.0"
description = "Private, on-device speech engine for Phonivra"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "huggingface-hub>=1.4,<2",
  "soundfile>=0.13,<1",
  "num2words @ git+https://github.com/savoirfairelinux/num2words.git@07814cb114157f582c40a00119c2e9faba8dcee2",
  "langid==1.1.6",
  "httpx>=0.28,<1",
  "onnxruntime-directml==1.24.4; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "f5-tts==1.1.22",
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2"
]

[project.scripts]
phonivra-engine = "phonivra_engine.__main__:main"

[tool.setuptools]
packages = ["phonivra_engine"]

[tool.setuptools.package-dir]
phonivra_engine = "src"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.setuptools.package-data]
phonivra_engine = ["contract.json", "model-assets.json"]

[tool.uv]
# Chatterbox pins its demo stack and older inference libraries. The desktop
# only imports the inference package. Keep its unused Gradio server out.
override-dependencies = [
  "gradio; python_version < '3.11'",
  "diffusers>=0.38,<0.39",
  "safetensors>=0.8.0,<1",
  "torch>=2.13,<2.14",
  "torchaudio==2.11.1",
  "transformers>=5.10,<5.11"
]
constraint-dependencies = [
  "pillow>=13",
  "starlette>=1.3.1",
  "pyarrow<24; python_version < '3.13'",
  "pandas<3; python_version < '3.13'"
]
